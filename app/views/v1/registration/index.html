{% extends "layouts/main.html" %}

{% set pageName = "GCA Service Login" %}

{% block content %}

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <h1 class="govuk-heading-xl">Sign in or create an account</h1>
    <p class="govuk-body">{% if data.loginMethod == "auth0" %}Use your GCA account to access the service.{% else %}Use GOV.UK One Login to access the GCA service.{% endif %}</p>
    <a class="govuk-button" href="/{{ version }}/registration/sign-up-start">Continue</a>

  </div>
</div>

{% endblock %}
